name: Build Advance

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with official devkitPro image
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            devkitpro/devkita64:latest \
            bash -lc 'make clean && make -j"$(nproc)"'
      - uses: actions/upload-artifact@v4
        with:
          name: Advance-Switch
          path: advance.nro
