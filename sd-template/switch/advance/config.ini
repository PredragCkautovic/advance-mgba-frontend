# Advance 0.1 — premium mGBA library frontend

[library]
rom_dir=sdmc:/mGBA/Roms
cover_dir=sdmc:/switch/advance/covers
scan_recursively=true
include_gb=false
include_gbc=false
show_hidden=false

[emulator]
mgba_nro=sdmc:/switch/mgba.nro
confirm_launch=false

[ui]
columns=6
rows=2
theme=crimson
use_account_profile=true
show_system_status=true
touch_enabled=true
motion_enabled=true
ui_sounds=true
ui_volume=72
dynamic_backdrop=true
backdrop_intensity=58
adaptive_accent=true
screen_transitions=true
launch_transition=true
show_cover_labels=false
